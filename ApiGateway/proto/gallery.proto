syntax = "proto3";

package proto;

option go_package = "/proto;proto";

service AlbumService {
  rpc CreateAlbum (CreateAlbumRequest) returns (CreateAlbumResponse);
  rpc GetAlbumsByUser (GetAlbumsByUserRequest) returns (GetAlbumsByUserResponse);
  rpc UpdateAlbum (UpdateAlbumRequest) returns (UpdateAlbumResponse);
  rpc DeleteAlbum (DeleteAlbumRequest) returns (DeleteAlbumResponse);
  rpc GetPrivateAlbum (GetPrivateAlbumRequest) returns (GetPrivateAlbumResponse);
}

service MediaService {
  rpc AddMedia (AddMediaRequest) returns (AddMediaResponse);
  rpc GetMediaByUser (GetMediaByUserRequest) returns (GetMediaByUserResponse);
  rpc MarkAsPrivate (MarkAsPrivateRequest) returns (MarkAsPrivateResponse);
  rpc GetPrivateMedia (GetPrivateMediaRequest) returns (GetPrivateMediaResponse);
  rpc DownloadMedia (DownloadMediaRequest) returns (DownloadMediaResponse);
  rpc DeleteMedia (DeleteMediaRequest) returns (DeleteMediaResponse);
  rpc DetectSimilarMedia (DetectSimilarMediaRequest) returns (DetectSimilarMediaResponse);
  rpc AddMediaToFavorite (AddMediaToFavoriteRequest) returns (AddMediaToFavoriteResponse);
  rpc GetMediaByAlbum(GetMediaByAlbumRequest) returns (GetMediaByAlbumResponse);
  rpc MoveMediaToAlbum(MoveMediaRequest) returns (MoveMediaResponse);
}

service UserService {
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  rpc SetUserPin (SetUserPinRequest) returns (SetUserPinResponse);
}

service ConsentService {
  rpc AddConsent (AddConsentRequest) returns (AddConsentResponse);
  rpc GetUserConsents (GetUserConsentsRequest) returns (GetUserConsentsResponse);
  rpc GetActiveConsent (GetActiveConsentRequest) returns (GetActiveConsentResponse);
  rpc CheckConsent (CheckConsentRequest) returns (CheckConsentResponse);
  rpc RevokeConsent (RevokeConsentRequest) returns (RevokeConsentResponse);
}

// Album messages
message CreateAlbumRequest {
  string name = 1;
  string description = 2;
  uint32 user_id = 3;
}

message CreateAlbumResponse {
  string message = 1;
}

message GetAlbumsByUserRequest {
  uint32 user_id = 1;
}

message AlbumWithMedia {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  uint32 user_id = 4;
  repeated Media media = 5;
}

message GetAlbumsByUserResponse {
  repeated AlbumWithMedia albums = 1;
}

message UpdateAlbumRequest {
  uint32 album_id = 1;
  string name = 2;
  string description = 3;
}

message UpdateAlbumResponse {
  string message = 1;
}

message DeleteAlbumRequest {
  uint32 album_id = 1;
}

message DeleteAlbumResponse {
  string message = 1;
}

message GetPrivateAlbumRequest {
  uint32 user_id = 1;
  string type = 2;
}

message GetPrivateAlbumResponse {
  Album album = 1;
}

// Media messages
message AddMediaRequest {
  string name = 1;
  uint32 album_id = 2;
  bytes file_data = 3;
}

message AddMediaResponse {
  string message = 1;
}

message GetMediaByUserRequest {
  uint32 user_id = 1;
}

message GetMediaByUserResponse {
  repeated Media media_list = 1;
}

message MarkAsPrivateRequest {
  uint32 media_id = 1;
}

message MarkAsPrivateResponse {
  string message = 1;
  bool pin_required = 2; 

}

message GetPrivateMediaRequest {
  uint32 user_id = 1;
}

message GetPrivateMediaResponse {
  repeated Media media = 1;
}

message DownloadMediaRequest {
  uint32 media_id = 1;
}

message DownloadMediaResponse {
  bytes file_data = 1;
}

message DeleteMediaRequest {
  uint32 media_id = 1;
}

message DeleteMediaResponse {
  string message = 1;
}

// User messages
message CreateUserRequest {
  string username = 1;
  string email = 2;
}

message CreateUserResponse {
  string message = 1;
}

// Requête
message GetMediaByAlbumRequest {
  uint32 album_id = 1;
}

// Réponse
message GetMediaByAlbumResponse {
  repeated Media media = 1;
}

// Data structures
message Album {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  uint32 user_id = 4;
  repeated Media media = 5;
}

message Media {
  uint32 id = 1;
  string name = 2;
  uint32 album_id = 3;
  uint32 file_size = 4;
  string path = 5;
  bool is_private = 6;
  bool is_favorite = 7;
}
message MediaGroup {
  repeated Media media = 1;
}

message DetectSimilarMediaRequest {
  uint32 album_id = 1;
}

message DetectSimilarMediaResponse {
  repeated MediaGroup groups = 1;
}

message AddMediaToFavoriteRequest {
  uint32 media_id = 1;
}

message AddMediaToFavoriteResponse {
  string message = 1;
}

message MoveMediaRequest {
    uint32 media_id = 1;
    uint32 target_album_id = 2;
}

message MoveMediaResponse {
    string message = 1;
}

// Consent messages
message AddConsentRequest {
  string consent_type = 1;
  string consent_version = 2;
  bool is_granted = 3;
  string consent_text = 4;
}

message AddConsentResponse {
  string message = 1;
  Consent consent = 2;
}

message GetUserConsentsRequest {
  uint32 user_id = 1;
}

message GetUserConsentsResponse {
  repeated Consent consents = 1;
  uint32 count = 2;
}

message GetActiveConsentRequest {
  uint32 user_id = 1;
  string consent_type = 2;
}

message GetActiveConsentResponse {
  Consent consent = 1;
}

message CheckConsentRequest {
  uint32 user_id = 1;
  string consent_type = 2;
}

message CheckConsentResponse {
  bool has_consent = 1;
  string consent_type = 2;
}

message RevokeConsentRequest {
  uint32 user_id = 1;
  uint32 consent_id = 2;
}

message RevokeConsentResponse {
  string message = 1;
}

message Consent {
  uint32 id = 1;
  string consent_type = 2;
  string consent_version = 3;
  bool is_granted = 4;
  string consent_text = 5;
  string revoked_at = 6;
  string created_at = 7;
  string updated_at = 8;
}

message SetUserPinRequest {
  uint32 user_id = 1;     
  string pin = 2;
}

message SetUserPinResponse {
  string message = 1;
}